[project]
name = "cutout"
version = "0.1.0"
description = "A security-research framework for authorized testing of agentic systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sanket Sarkar" }]
keywords = ["security", "agentic", "mcp", "red-team", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=2",  # official MCP client — recon against real MCP servers
]

[project.scripts]
cutout = "cutout.cli:main"

# Built-in modules are also discoverable via entry points, proving the
# out-of-tree registration path. In-tree modules are found by package walk.
[project.entry-points."cutout.modules"]
"CUT-INV-001" = "cutout.modules.inventory.session_inventory"

[project.optional-dependencies]
# Only needed to RUN the range as networked services (docker-compose or local uvicorn).
# Attacking a running range needs only the core deps (httpx).
range = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cutout", "cutout_range"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["cutout", "cutout_range", "tests"]
# Don't format/lint Python snippets embedded in Markdown docs (e.g. CLAUDE.md).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# RUF012: modules declare metadata as class attributes by design (declarative contract).
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# B008: Typer's Option/Argument calls in parameter defaults are the intended idiom.
"cutout/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
