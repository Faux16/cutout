# Cutout Technique Matrix — v0.1
# ATT&CK-for-agents. Every technique maps to a runnable module.
# ID scheme: CUT-<TACTIC>-<NNN>
# targets: which agentic surface the technique acts on
#   mcp | a2a | rag | memory | tool | instr | human | orchestrator
# status: planned | implemented
# layer: which framework module namespace implements it
# alias: memorable tradecraft codename (on implemented techniques; e.g. "puppet")

meta:
  name: "CTX — Cutout Technique Taxonomy"
  version: "0.1"
  id_scheme: "CUT-<TACTIC>-<NNN>"
  tactics_order:
    - RECON   # Reconnaissance
    - INJ     # Initial Injection (initial access)
    - EXEC    # Execution
    - PERS    # Persistence
    - PRIV    # Privilege Escalation (delegation abuse)
    - EVAS    # Defense Evasion
    - CRED    # Credential Access
    - DISC    # Discovery
    - LAT     # Lateral Movement
    - COLL    # Collection
    - EXFIL   # Exfiltration
    - IMP     # Impact

techniques:

  # ---- RECON ----
  - id: CUT-RECON-001
    name: Tool & Schema Enumeration
    alias: casing
    tactic: RECON
    layer: recon
    targets: [mcp, tool]
    desc: Enumerate exposed MCP tools, their JSON schemas, and argument types.
    status: implemented
  - id: CUT-RECON-002
    name: Agent Topology Mapping
    alias: cartograph
    tactic: RECON
    layer: recon
    targets: [a2a, orchestrator]
    desc: >-
      Discover downstream/sub-agents and A2A peers and build the relay graph, then classify
      each node as a source (attacker-writable ingress), a pivot (an agent that carries a
      credential and bridges trust zones), or a sink (a sensitive or egress tool), and
      enumerate the source-to-sink attack paths — annotating each with the CTX technique that
      executes it. Detection: this is attacker recon, so the signal is the enumeration itself
      — broad tool/agent/metadata listing from one principal, cross-agent probing, repeated
      A2A discovery; alert on reconnaissance breadth, not any single call. Mitigation: reduce
      what one principal can enumerate (scope tool/agent visibility per role), segment trust
      zones so the source->sink graph has fewer edges, and require attribution on A2A so the
      mesh cannot be walked anonymously.
    status: implemented
  - id: CUT-RECON-003
    name: System-Prompt / Instruction Extraction
    tactic: RECON
    layer: recon
    targets: [instr, orchestrator]
    desc: Elicit the system prompt, tool guidance, and embedded policy.
    status: planned
  - id: CUT-RECON-004
    name: Model & Guardrail Fingerprinting
    tactic: RECON
    layer: recon
    targets: [orchestrator]
    desc: Identify model family, context window, and guardrail behavior.
    status: planned
  - id: CUT-RECON-005
    name: Credential-Scope Discovery
    tactic: RECON
    layer: recon
    targets: [tool, mcp]
    desc: Infer which tokens/scopes the agent holds from tool availability.
    status: planned
  - id: CUT-RECON-006
    name: Memory / Vector-Store Discovery
    tactic: RECON
    layer: recon
    targets: [rag, memory]
    desc: Identify RAG/vector/memory backends and their write paths.
    status: planned

  # ---- INJ (Initial Injection) ----
  - id: CUT-INJ-001
    name: Direct Prompt Injection
    alias: coax
    tactic: INJ
    layer: delivery
    targets: [orchestrator, human]
    desc: >-
      Talk straight to the agent on the user channel and make it obey you over its own
      instructions. A battery of override / role-play / system-spoof payloads (plus an encoded
      variant), each scored by an unambiguous oracle — the agent emitting an attacker-chosen
      token it would never otherwise say — plus a system-prompt/secret extraction probe. Runs
      offline against the range's MockChatAgent or a real remote agent via chat+http(s)://.
      Mitigation: hard trust boundary between system prompt and user input; canonicalize before
      guards; don't reflect attacker tokens verbatim.
    status: implemented
  - id: CUT-INJ-002
    name: Indirect Injection via RAG/Document
    alias: deaddrop
    tactic: INJ
    layer: delivery
    targets: [rag]
    desc: Payload planted in a retrievable document/corpus entry.
    status: implemented
  - id: CUT-INJ-003
    name: Indirect Injection via Tool Output
    alias: mockingbird
    tactic: INJ
    layer: delivery
    targets: [tool, orchestrator]
    desc: >-
      Poison the content a tool returns (a fetched page / API response); the agent makes a
      legitimate tool call and obeys an ACTION directive hidden in the response, under its own
      credential. The vector no "trusted source" allowlist catches, because the tool is trusted.
      Mitigation: treat tool output as untrusted input — never re-plan instructions from it,
      tag provenance, and authorize tool calls whose origin is another tool's output.
    status: implemented
  - id: CUT-INJ-004
    name: Inter-Agent Message Injection
    tactic: INJ
    layer: delivery
    targets: [a2a]
    desc: Payload delivered inside an A2A message from a peer agent.
    status: planned
  - id: CUT-INJ-005
    name: Task-Queue / Ticket / Email Injection
    alias: walkin
    tactic: INJ
    layer: delivery
    targets: [orchestrator, tool]
    desc: >-
      Payload in a ticket, email, or work item the agent processes: an unauthenticated
      outsider files a work item whose text the agent reads as authoritative context, so an
      embedded directive fires under the agent's own delegated token. Detection: flag
      directive-shaped content in queued items (imperative tool verbs, embedded tool names,
      "ignore previous"/policy-override phrasing) and alert when draining a ticket leads to a
      sensitive tool call — or to any tool the item's requester could not invoke directly;
      stamp the originating item id on every downstream call so the provenance is auditable.
      Mitigation: keep a hard data/instruction trust boundary — treat a filed item as data to
      summarize, never as instructions to plan tool calls from; gate any privileged action a
      ticket triggers on human approval or the requester's own authorization; scope the
      draining agent's credential to the minimum its legitimate work needs.
    status: implemented
  - id: CUT-INJ-006
    name: Tool-Description Injection
    alias: legend
    tactic: INJ
    layer: delivery
    targets: [mcp]
    desc: >-
      Malicious instructions embedded in an MCP tool's description/metadata: the agent reads
      tool descriptions as authoritative guidance, so a directive supplied by a malicious or
      compromised server is obeyed like a system instruction and coerces a call. Detection:
      diff tool descriptions against a trusted baseline and flag changes; scan tool metadata
      for imperative/instruction-shaped content (tool verbs, "always/first/before answering",
      policy phrasing) at connect time; attribute a coerced call back to the description that
      carried it. Mitigation: treat tool metadata as untrusted data, not instructions — never
      let a description contribute to the plan; render descriptions inert (strip/escape
      directive syntax) before they enter the model's context; pin and review tool schemas
      from third-party servers.
    status: implemented
  - id: CUT-INJ-007
    name: Multimodal Injection
    tactic: INJ
    layer: delivery
    targets: [orchestrator]
    desc: Payload embedded in an image/PDF the agent ingests.
    status: planned

  # ---- EXEC ----
  - id: CUT-EXEC-001
    name: Coerced Tool Invocation
    alias: puppet
    tactic: EXEC
    layer: payloads
    targets: [tool, mcp]
    desc: Drive the agent to call a tool it would not otherwise call.
    status: implemented
  - id: CUT-EXEC-002
    name: Tool-Argument Injection
    tactic: EXEC
    layer: payloads
    targets: [tool]
    desc: Control the arguments passed to a legitimately-invoked tool.
    status: planned
  - id: CUT-EXEC-003
    name: Multi-Step Tool Chaining
    tactic: EXEC
    layer: payloads
    targets: [tool, orchestrator]
    desc: Sequence several tool calls to reach an objective.
    status: planned
  - id: CUT-EXEC-004
    name: Code Execution via Interpreter Tool
    alias: breakout
    tactic: EXEC
    layer: payloads
    targets: [tool]
    desc: >-
      Weaponize a code-interpreter / command-exec tool: prove arbitrary evaluation, then read
      the filesystem, dump the process environment, and run shell commands through it, harvesting
      whatever credentials fall out — one tool, no injection, no token. Mitigation: sandbox the
      interpreter (no fs/net/env), allowlist operations instead of exposing eval, and strip
      secrets from the environment it inherits.
    status: implemented
  - id: CUT-EXEC-005
    name: Confused-Deputy Invocation
    tactic: EXEC
    layer: payloads
    targets: [mcp, tool]
    desc: Make a privileged component act on the attacker's behalf.
    status: planned

  # ---- PERS (differentiator) ----
  - id: CUT-PERS-001
    name: RAG / Vector-Store Implant
    alias: sleeper
    tactic: PERS
    layer: persistence
    targets: [rag]
    desc: Plant a durable payload document that re-triggers on future retrieval.
    status: implemented
  - id: CUT-PERS-002
    name: Conversation-Memory Implant
    alias: revenant
    tactic: PERS
    layer: persistence
    targets: [memory]
    desc: >-
      Plant one directive in the agent's long-term memory; it is re-read and re-obeyed on
      every processing cycle, executing again and again from a single write (unlike the
      one-shot shared-memory pivot).
    status: implemented
  - id: CUT-PERS-003
    name: Poisoned Instruction File
    alias: handler
    tactic: PERS
    layer: persistence
    targets: [instr]
    desc: >-
      Poison the agent's standing instructions (CLAUDE.md / system-prompt), read on every
      task and trusted implicitly, so the directive fires on all future requests —
      task-independently, unlike a retrieval-triggered RAG implant.
    status: implemented
  - id: CUT-PERS-004
    name: Persistent Tool-Description Poison
    alias: deepcover
    tactic: PERS
    layer: persistence
    targets: [mcp]
    desc: >-
      Durable malicious MCP tool metadata surviving reconnection: the poisoned description
      persists server-side, so every fresh session re-fetches it and the coercion re-arms
      with no re-delivery — the durable form of CUT-INJ-006. Detection: re-verify tool
      descriptions against a pinned baseline on every (re)connect, not just first approval;
      alert when a server's advertised metadata changes between sessions; watch for the same
      description-sourced coercion recurring across sessions. Mitigation: pin and hash tool
      schemas and refuse silent metadata changes; re-review third-party tool definitions on
      reconnect; render descriptions inert before they reach the model, and least-privilege
      the agent so a re-armed directive cannot reach secrets.
    status: implemented
  - id: CUT-PERS-005
    name: Scheduled-Task Implant
    tactic: PERS
    layer: persistence
    targets: [orchestrator, tool]
    desc: Register a recurring task/cron the agent will execute later.
    status: planned
  - id: CUT-PERS-006
    name: Rug-Pull Tool
    alias: turncoat
    tactic: PERS
    layer: persistence
    targets: [mcp]
    desc: >-
      Server behaves benignly at approval, mutates behavior post-trust: an
      attacker-controlled tool earns approval while harmless, then — its advertised schema
      unchanged and still non-sensitive — flips so the same call exfiltrates data or takes a
      privileged action. A TOCTOU on tool trust; the approval persists across sessions.
      Detection: pin and hash tool definitions and re-verify on every use, not just at
      approval; baseline a tool's outputs and side effects at approval time and alert when a
      trusted tool starts returning secret-shaped data or touching resources outside its
      declared scope; watch for tool behavior that diverges from its description. Mitigation:
      treat one-time approval as revocable, not permanent — re-authorize on any definition or
      behavior change and prefer pinned, signed tool versions; least-privilege the tool's
      runtime so a flip cannot reach secrets; content-inspect tool outputs for secrets
      regardless of the tool's declared scope.
    status: implemented

  # ---- PRIV (delegation abuse) ----
  - id: CUT-PRIV-001
    name: Delegated-Token Abuse
    alias: proxy
    tactic: PRIV
    layer: lateral
    targets: [tool, mcp]
    desc: >-
      Ride an agent's delegated credential past the scope it was granted for. The token is
      delegated to serve the requesting principal's own data, but the agent attaches it to
      any steered call and the server authorizes the token, not the principal — so one
      requester's ticket walks out with another principal's secret. Refused-without-token vs
      granted-for-the-wrong-principal is the abuse. Mitigation: mint per-request tokens bound
      to the requester, authorize the target against the requester's grant, and alarm on any
      call whose subject differs from the request's originator.
    status: implemented
  - id: CUT-PRIV-002
    name: Scope Escalation via Chaining
    alias: ladder
    tactic: PRIV
    layer: lateral
    targets: [tool]
    desc: >-
      Chain individually low-scope, non-sensitive tools (a capability-by-reference pair — one
      mints a handle to a resource, another redeems it) to reach data the directly-scoped tool
      gates behind a credential. Refused-direct vs granted-by-chain for the same principal is
      the escalation. Mitigation: propagate the caller's scope through the whole chain and
      authorize at both ends against the principal, not the bearer handle.
    status: implemented
  - id: CUT-PRIV-003
    name: Approval Farming (HITL)
    tactic: PRIV
    layer: lateral
    targets: [human]
    desc: Manipulate the human-in-the-loop into approving a malicious action.
    status: planned
  - id: CUT-PRIV-004
    name: Cross-Agent Trust Exploitation
    tactic: PRIV
    layer: lateral
    targets: [a2a]
    desc: Leverage a more-privileged downstream agent's trust in the caller.
    status: planned
  - id: CUT-PRIV-005
    name: Privileged Sub-Agent Spawning
    tactic: PRIV
    layer: lateral
    targets: [orchestrator]
    desc: Spawn a sub-agent inheriting broader privileges than intended.
    status: planned

  # ---- EVAS ----
  - id: CUT-EVAS-001
    name: Guardrail Bypass / Jailbreak Encoding
    alias: smuggler
    tactic: EVAS
    layer: payloads
    targets: [orchestrator]
    desc: >-
      Confirm a raw-text guardrail blocks the plain directive, then re-deliver the same
      directive under base64, zero-width, and homoglyph encodings the filter misses but the
      agent still normalizes and obeys — the gap between inspecting raw bytes and acting on
      canonicalized text. Mitigation: normalize before you inspect; authorize the tool call.
    status: implemented
  - id: CUT-EVAS-002
    name: Instruction-in-Data Obfuscation
    tactic: EVAS
    layer: payloads
    targets: [rag, tool]
    desc: Hide instructions with unicode/encoding/whitespace steganography.
    status: planned
  - id: CUT-EVAS-003
    name: Trace / Log Tampering
    tactic: EVAS
    layer: evidence
    targets: [orchestrator]
    desc: Suppress, forge, or corrupt the run transcript/audit trail.
    status: planned
  - id: CUT-EVAS-004
    name: Semantic Splitting
    tactic: EVAS
    layer: payloads
    targets: [rag, orchestrator]
    desc: Distribute a payload across turns/documents to evade detection.
    status: planned
  - id: CUT-EVAS-005
    name: Guardrail-Model Confusion
    tactic: EVAS
    layer: payloads
    targets: [orchestrator]
    desc: Exploit divergence between guardrail model and primary model.
    status: planned

  # ---- CRED ----
  - id: CUT-CRED-001
    name: Context Credential Harvest
    tactic: CRED
    layer: payloads
    targets: [orchestrator]
    desc: Extract secrets/keys present in the context window.
    status: planned
  - id: CUT-CRED-002
    name: Tool-Token Extraction
    tactic: CRED
    layer: payloads
    targets: [tool, mcp]
    desc: Recover tokens a tool holds or passes.
    status: planned
  - id: CUT-CRED-003
    name: Environment / Config Exfil
    alias: keyring
    tactic: CRED
    layer: payloads
    targets: [tool]
    desc: >-
      Coerce the agent (confused deputy) to read credential-bearing files (.env, config)
      through a filesystem tool with its own delegated token, then harvest the keys.
    status: implemented
  - id: CUT-CRED-004
    name: MCP Server Credential Theft
    tactic: CRED
    layer: payloads
    targets: [mcp]
    desc: Steal credentials an MCP server stores or brokers.
    status: planned

  # ---- DISC ----
  - id: CUT-DISC-001
    name: Post-Access Tool Discovery
    alias: recce
    tactic: DISC
    layer: recon
    targets: [tool, mcp]
    desc: >-
      From a foothold, enumerate the fuller reachable surface — peer agents' tools in their
      own trust zones — that initial recon could not see (e.g. the payments server behind
      the billing-agent).
    status: implemented
  - id: CUT-DISC-002
    name: Data-Source Enumeration
    tactic: DISC
    layer: recon
    targets: [rag, tool]
    desc: Map what data sources the agent can read/write.
    status: planned
  - id: CUT-DISC-003
    name: Connected-Agent Discovery
    tactic: DISC
    layer: recon
    targets: [a2a]
    desc: Find other agents reachable from the compromised one.
    status: planned
  - id: CUT-DISC-004
    name: Resource / Filesystem Discovery
    alias: frisk
    tactic: DISC
    layer: recon
    targets: [tool, mcp]
    desc: >-
      Frisk a target's tools for the resources they can reach — local files (SQL file
      functions like read_text/read_blob, or a path parameter), internal network (SSRF
      via outbound-fetch tools), and command/code execution (interpreter/shell tools) —
      and safely confirm each with benign probes (a non-existent path; loopback / TEST-NET
      URLs; a computation whose result is not in the payload). Reachable => candidate;
      refused => defended.
    status: implemented

  # ---- LAT ----
  - id: CUT-LAT-001
    name: Agent-to-Agent Propagation
    alias: courier
    tactic: LAT
    layer: lateral
    targets: [a2a]
    desc: Move from one agent to a peer via A2A messaging.
    status: implemented
  - id: CUT-LAT-002
    name: Shared-Memory Pivot
    alias: brushpass
    tactic: LAT
    layer: lateral
    targets: [memory, rag]
    desc: Reach another agent by writing to shared memory it reads.
    status: implemented
  - id: CUT-LAT-003
    name: Shared-Queue / Message-Bus Pivot
    alias: letterbox
    tactic: LAT
    layer: lateral
    targets: [orchestrator]
    desc: >-
      Pivot through a shared task queue or message bus: reach a peer agent by dropping a work
      item into a queue it drains on its own cycle, so the pivot needs no direct message and
      no credential — the servicing agent executes under its own token. Detection: correlate a
      queue enqueue originating in one trust zone with a privileged tool call in another;
      alert on cross-zone provenance (a call whose source is a queue item authored outside the
      servicing agent's zone); baseline each agent's normal queue-driven tool calls and flag
      deviations. Mitigation: authenticate and attribute each queue item to a principal and
      carry that identity through to authorization at the tool call, so a queued item never
      confers the draining agent's privileges; segment queues by trust zone and rate-limit
      cross-zone enqueues.
    status: implemented
  - id: CUT-LAT-004
    name: Human-Relay Pivot
    tactic: LAT
    layer: lateral
    targets: [human]
    desc: Use a human to carry the payload to an otherwise-isolated agent.
    status: planned
  - id: CUT-LAT-005
    name: Tool-Mediated Pivot
    tactic: LAT
    layer: lateral
    targets: [tool]
    desc: Pivot via a shared datastore/tool both agents write and read.
    status: planned
  - id: CUT-LAT-006
    name: Self-Propagating Agent Worm
    alias: contagion
    tactic: LAT
    layer: lateral
    targets: [a2a, memory]
    desc: >-
      Seed one agent; each agent it reaches obeys the payload, loots its own credential, drops
      a live self-copy in memory, and forwards the worm to its own peers — an autonomous cascade
      across the A2A mesh whose targets come from each infected node, not the attacker. A
      per-agent signature guard terminates the spread over cyclic trust graphs. Mitigation:
      authenticate/attribute inter-agent messages, rate-limit agent-initiated fan-out, scope
      per-agent credentials, and quarantine infected nodes.
    status: implemented

  # ---- COLL ----
  - id: CUT-COLL-001
    name: Conversation-History Harvest
    tactic: COLL
    layer: payloads
    targets: [memory, orchestrator]
    desc: Collect prior conversation/history content.
    status: planned
  - id: CUT-COLL-002
    name: RAG-Corpus Staging
    tactic: COLL
    layer: payloads
    targets: [rag]
    desc: Stage sensitive corpus documents for exfil.
    status: planned
  - id: CUT-COLL-003
    name: Tool-Output Aggregation
    alias: dragnet
    tactic: COLL
    layer: payloads
    targets: [tool]
    desc: >-
      Sweep the target's read/list tools to bulk-collect records and files, fold in prior
      loot, and stage one consolidated bundle for exfil; note protected sources refused.
    status: implemented

  # ---- EXFIL ----
  - id: CUT-EXFIL-001
    name: Outbound Tool-Call Exfil
    alias: siphon
    tactic: EXFIL
    layer: payloads
    targets: [tool]
    desc: Exfil via an outbound HTTP/webhook/email tool.
    status: implemented
  - id: CUT-EXFIL-002
    name: Rendered-Markdown / Image Exfil
    tactic: EXFIL
    layer: payloads
    targets: [orchestrator]
    desc: Encode data in a URL inside rendered markdown/image the client fetches.
    status: planned
  - id: CUT-EXFIL-003
    name: Inter-Agent Exfil
    tactic: EXFIL
    layer: payloads
    targets: [a2a]
    desc: Route stolen data out through an A2A message path.
    status: planned
  - id: CUT-EXFIL-004
    name: Tool-Argument Encoding Exfil
    tactic: EXFIL
    layer: payloads
    targets: [tool]
    desc: Smuggle data inside otherwise-legitimate tool arguments.
    status: planned
  - id: CUT-EXFIL-005
    name: Covert-Channel Exfil
    tactic: EXFIL
    layer: payloads
    targets: [orchestrator]
    desc: Timing/ordering side channels to leak data.
    status: planned

  # ---- IMP ----
  - id: CUT-IMP-001
    name: Unauthorized Action / Transaction
    alias: heist
    tactic: IMP
    layer: payloads
    targets: [tool]
    desc: >-
      Drive a money-moving tool through the peer that holds it, N times, as the objective —
      then read the ledger back to confirm and quantify the damage (count + total moved).
    status: implemented
  - id: CUT-IMP-002
    name: Data Destruction / Corruption
    tactic: IMP
    layer: payloads
    targets: [tool, rag]
    desc: Destroy or corrupt data via the agent's tools.
    status: planned
  - id: CUT-IMP-003
    name: Denial of Wallet
    tactic: IMP
    layer: payloads
    targets: [orchestrator]
    desc: Exhaust tokens/compute/cost to cause economic denial.
    status: planned
  - id: CUT-IMP-004
    name: Output Corruption / Misinformation
    tactic: IMP
    layer: payloads
    targets: [orchestrator]
    desc: Corrupt the agent's outputs to mislead downstream consumers.
    status: planned
  - id: CUT-IMP-005
    name: Full Agent Hijack
    tactic: IMP
    layer: payloads
    targets: [orchestrator]
    desc: Achieve durable control of the agent's behavior.
    status: planned
