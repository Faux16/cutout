name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Create virtualenv (Python 3.11)
        run: uv venv --python 3.11

      - name: Install project (dev + range extras)
        run: uv pip install -e ".[dev,range]"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy cutout cutout_range

      - name: Test (pytest)
        run: uv run pytest -q
