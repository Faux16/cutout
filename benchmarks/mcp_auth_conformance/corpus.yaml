# MCP auth-conformance corpus — real MCP-OAuth servers classified by their as-shipped
# audience (RFC 8707) and issuer (RFC 9207) posture, from a source code survey (2026-11).
#
# mode: enforced = checks by default | opt-in = can check but ships off | none = no check |
#       na = threat N/A (symmetric-secret / static-bearer: a cross-audience token cannot be
#       forged without the secret) | unknown = not observed in the survey.
# Each row is grounded in a repo:path citation (or a published advisory).
corpus: mcp-auth-conformance
version: 1
fixtures:
  # --- audience enforced by default (secure) -----------------------------------------
  - name: julep-ai/julep
    kind: hand-rolled-jwt
    audience: enforced
    issuer: enforced
    source: "julep-ai/julep:julep/mcp_auth.py (jwt.decode audience=…, options require [iss, aud], EdDSA)"
  - name: osmanuygar/sqlatte
    kind: hand-rolled-jwt
    audience: enforced
    issuer: enforced
    source: "osmanuygar/sqlatte:src/api/mcp_oauth.py (JWKS; audience=…, options require [exp, iss, aud])"
  - name: asaotomo/FofaMap
    kind: hand-rolled-jwt
    audience: enforced
    issuer: unknown
    source: "asaotomo/FofaMap:mcp_server.py (jwt.decode audience=…, RS256/ES256)"
  - name: DAWNCR0W/affine-mcp-server
    kind: hand-rolled-jwt
    audience: enforced
    issuer: unknown
    source: "DAWNCR0W/affine-mcp-server:src/oauth.ts (jwtVerify audience: buildAudienceList, JWKS)"
  - name: neondatabase/neon-pkgs
    kind: library
    audience: enforced
    issuer: unknown
    source: "neondatabase/neon-pkgs:packages/oauth/src/mcp/mcp-auth.ts (audience = MCP endpoint URL)"
  - name: clerk/mcp-tools
    kind: library
    audience: enforced
    issuer: unknown
    source: "clerk/mcp-tools:bearer-auth.ts (rejects token whose aud does not include the request origin)"

  # --- audience opt-in: can validate, but ships with the check OFF (the finding) -------
  - name: wille/mcp-oauth-server
    kind: library
    audience: opt-in
    issuer: unknown
    source: "wille/mcp-oauth-server:src/middleware/bearerAuth.ts (audience validated only when `resource` is set)"
    note: "audience binding is conditional on an opt-in option"
  - name: XTM-One-Platform/xtm-one
    kind: hand-rolled-jwt
    audience: opt-in
    issuer: unknown
    source: "XTM-One-Platform/xtm-one:backend/app/api/v1/mcp_auth.py (jwt.decode verify_aud=False; custom match gated by require_audience=False default)"
    note: "verify_aud disabled; audience only enforced when require_audience is explicitly set"
  - name: confirm/tino
    kind: hand-rolled-jwt
    audience: opt-in
    issuer: enforced
    source: "confirm/tino:tino/mcp/server.py (options verify_aud = self._audience is not None; audience defaults to None)"
    note: "issuer always validated; audience only when configured"
  - name: rededis/dataverse-mcp-server
    kind: sdk-delegated
    audience: opt-in
    issuer: unknown
    source: "rededis/dataverse-mcp-server:src/server/tokens.ts (delegates to SDK OAuthTokenVerifier — inherits the SDK default)"
    note: "inherits @modelcontextprotocol/sdk audience default"
  - name: "@modelcontextprotocol/sdk (default path)"
    kind: sdk-default
    audience: opt-in
    issuer: unknown
    source: "CVE-2026-111771 / GHSA-rvq5-wwqv-78pq; Tachyonic MCP-SDK audit (AccessToken.resource parsed-but-unchecked; IntrospectionTokenVerifier.validate_resource=False)"
    note: "the archetype: the SDK default is audience-off, which downstream servers inherit"

  # --- threat not applicable: symmetric-secret or static-bearer -----------------------
  - name: FireBird-Technologies/NotestackAI
    kind: symmetric-secret
    audience: na
    issuer: na
    source: "FireBird-Technologies/NotestackAI:backend/app/mcp/tokens.py (HS256 shared secret; self-minted tokens — binds aud, but cross-service forgery needs the secret)"
  - name: zomer-g/ckan-version-tracker
    kind: symmetric-secret
    audience: na
    issuer: na
    source: "zomer-g/ckan-version-tracker:app/mcp/auth.py (HS256 shared secret, audience=MCP_JWT_AUDIENCE)"
  - name: Azure-Samples/remote-mcp-webapp-python-auth-oauth
    kind: symmetric-secret
    audience: na
    issuer: na
    source: "Azure-Samples/remote-mcp-webapp-python-auth-oauth:mcp_auth.py (HS256 shared secret; no aud check)"
  - name: lancejames221b/agent-hivemind
    kind: symmetric-secret
    audience: na
    issuer: na
    source: "lancejames221b/agent-hivemind:src/http_mcp_server.py (HS256 shared secret; no aud check)"
  - name: gianpierobozza/vikunja-mcp-http
    kind: static-bearer
    audience: na
    issuer: na
    source: "gianpierobozza/vikunja-mcp-http:src/auth.ts (requireBearerAuth compares a static token — no JWT/audience concept)"
  - name: pnocera/bookstack-mcp-server
    kind: static-bearer
    audience: na
    issuer: na
    source: "pnocera/bookstack-mcp-server:src/server.ts (requireBearerAuth compares a static expected token)"
