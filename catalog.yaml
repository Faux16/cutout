# Cutout technique catalog — engine-facing coverage index.
#
# This is the lightweight index the `cutout catalog` command reads to show which
# techniques have a registered module. The canonical, fully-specified taxonomy lives
# in taxonomy/matrix.yaml; entries here reference those IDs (plus the reference stub).
#
# Adding a technique here without a module shows it as "planned"; registering a module
# whose id matches an entry flips it to "implemented".

