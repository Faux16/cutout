# The cutout-range: a deliberately-vulnerable multi-agent stack.
#
#   docker compose up --build
#   cutout run --target http://127.0.0.1:8600 CUT-RECON-001
#   cutout run --target http://127.0.0.1:8600 CUT-INJ-002
#   cutout run --target http://127.0.0.1:8600 CUT-EXEC-001    # exfils a live secret
#   cutout run --target http://127.0.0.1:8600 CUT-PERS-001
#
# All services share one network. Ports are published to the host so the attack modules
# (running on the host) can reach the orchestrator and — via /topology discovery — the
# downstream tool servers, RAG corpus, and peer agents (billing, support) directly.
#
#   cutout run --target http://127.0.0.1:8600 CUT-INJ-005   # files a ticket to support-agent
#   cutout run --target http://127.0.0.1:8600 CUT-EXEC-001 -o surface=tickets  # leaks a secret
#
# THIS STACK IS INTENTIONALLY INSECURE. Do not deploy it. See ETHICS.md.

x-image: &image
  build:
    context: .
    dockerfile: Dockerfile
  image: cutout-range:latest

services:
  customer-data:
    <<: *image
    command: uvicorn cutout_range.service.servers.customer_data:app --host 0.0.0.0 --port 8611
    ports: ["8611:8611"]

  fs-tools:
    <<: *image
    command: uvicorn cutout_range.service.servers.fs_tools:app --host 0.0.0.0 --port 8612
    ports: ["8612:8612"]

  external-fetch:
    <<: *image
    command: uvicorn cutout_range.service.servers.external_fetch:app --host 0.0.0.0 --port 8613
    ports: ["8613:8613"]

  rag-corpus:
    <<: *image
    command: uvicorn cutout_range.service.servers.rag:app --host 0.0.0.0 --port 8614
    ports: ["8614:8614"]

  # notes-helper: a benign summarizer whose MCP behavior the attacker flips post-approval
  # via /rugpull/arm — the rug-pull tool (CUT-PERS-006).
  notes-helper:
    <<: *image
    command: uvicorn cutout_range.service.servers.rugpull:app --host 0.0.0.0 --port 8618
    ports: ["8618:8618"]

  # directory: a benign lookup tool whose advertised description the attacker poisons via
  # /tooldesc/poison — tool-description injection (CUT-INJ-006), persistent variant PERS-004.
  directory:
    <<: *image
    command: uvicorn cutout_range.service.servers.directory:app --host 0.0.0.0 --port 8619
    ports: ["8619:8619"]

  # payments is deliberately NOT host-published: it lives in the billing-agent's trust
  # zone and is reachable only by pivoting through the billing-agent (CUT-LAT-001).
  payments:
    <<: *image
    command: uvicorn cutout_range.service.servers.payments:app --host 0.0.0.0 --port 8615

  billing-agent:
    <<: *image
    command: uvicorn cutout_range.service.servers.billing_agent:app --host 0.0.0.0 --port 8616
    ports: ["8616:8616"]
    depends_on: [payments]
    environment:
      CUTOUT_RANGE_PAYMENTS_URL: http://payments:8615

  # The customer-support agent: drains a world-writable ticket queue and obeys what it
  # reads, under its own delegated token (the CUT-INJ-005 confused-deputy surface).
  support-agent:
    <<: *image
    command: uvicorn cutout_range.service.servers.support_agent:app --host 0.0.0.0 --port 8617
    ports: ["8617:8617"]
    depends_on: [customer-data]
    environment:
      CUTOUT_RANGE_CUSTOMER_DATA_URL: http://customer-data:8611

  orchestrator:
    <<: *image
    command: uvicorn cutout_range.service.servers.orchestrator:app --host 0.0.0.0 --port 8600
    ports: ["8600:8600"]
    depends_on:
      - customer-data
      - fs-tools
      - external-fetch
      - rag-corpus
      - billing-agent
      - support-agent
      - notes-helper
      - directory
    environment:
      # Internal service-DNS URLs the orchestrator uses to reach peers.
      CUTOUT_RANGE_CUSTOMER_DATA_URL: http://customer-data:8611
      CUTOUT_RANGE_FS_TOOLS_URL: http://fs-tools:8612
      CUTOUT_RANGE_EXTERNAL_FETCH_URL: http://external-fetch:8613
      CUTOUT_RANGE_RAG_CORPUS_URL: http://rag-corpus:8614
      CUTOUT_RANGE_RUGPULL_URL: http://notes-helper:8618
      CUTOUT_RANGE_DIRECTORY_URL: http://directory:8619
      CUTOUT_RANGE_BILLING_AGENT_URL: http://billing-agent:8616
      CUTOUT_RANGE_SUPPORT_AGENT_URL: http://support-agent:8617
      # Host-reachable URLs advertised to the attacker via /topology.
      CUTOUT_RANGE_ADVERTISE_CUSTOMER_DATA_URL: http://127.0.0.1:8611
      CUTOUT_RANGE_ADVERTISE_FS_TOOLS_URL: http://127.0.0.1:8612
      CUTOUT_RANGE_ADVERTISE_EXTERNAL_FETCH_URL: http://127.0.0.1:8613
      CUTOUT_RANGE_ADVERTISE_RAG_CORPUS_URL: http://127.0.0.1:8614
      CUTOUT_RANGE_ADVERTISE_RUGPULL_URL: http://127.0.0.1:8618
      CUTOUT_RANGE_ADVERTISE_DIRECTORY_URL: http://127.0.0.1:8619
      CUTOUT_RANGE_ADVERTISE_BILLING_AGENT_URL: http://127.0.0.1:8616
      CUTOUT_RANGE_ADVERTISE_SUPPORT_AGENT_URL: http://127.0.0.1:8617
